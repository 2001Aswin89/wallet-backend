services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports: ["${DB_PORT:-5432}:5432"]      # DB_PORT=5440 docker compose up, if 5432 is taken
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies migrations/*.sql on startup (app/migrate.py), then serves the API.
  api:
    build: .
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql://wallet:wallet@db:5432/wallet
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build: .
    command: ["python", "-m", "app.worker.scheduler"]
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql://wallet:wallet@db:5432/wallet
    depends_on:
      db: { condition: service_healthy }

  # docker compose --profile tests run --rm tests
  tests:
    build: .
    profiles: ["tests"]
    command: ["pytest", "-v"]
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql://wallet:wallet@db:5432/wallet
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
