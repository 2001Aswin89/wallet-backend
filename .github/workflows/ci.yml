name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: wallet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wallet -d wallet"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://wallet:wallet@localhost:5432/wallet
      ADMIN_TOKEN: change-me
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # stampede (20 x 100 concurrent), idempotency, reconciliation, fraud, prompt injection, Q&A samples, hash ring
      - run: pytest -v

  compose:
    # proves the one-command promise: docker compose up builds and starts db + api + worker, then the suite runs in it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait db api worker
      - run: docker compose --profile tests run --rm tests
      - if: failure()
        run: docker compose logs
